const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
async function tryOpen(pw,remember){
  document.getElementById('go').textContent='여는 중…';
  try{const html=await open_(pw);
    try{remember?localStorage.setItem('ckc_pw',pw):localStorage.removeItem('ckc_pw')}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('err').textContent='비밀번호가 맞지 않아요';document.getElementById('go').textContent='열기';
    try{localStorage.removeItem('ckc_pw')}catch(e){}}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();tryOpen(document.getElementById('pw').value,document.getElementById('rem').checked)};
let saved=null;try{saved=localStorage.getItem('ckc_pw')}catch(e){}
if(saved)tryOpen(saved,true);
